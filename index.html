<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050a">
<meta name="format-detection" content="telephone=no">
<title>MONEY TRAP 2070 — Ronin VII &amp; Jarron X</title>
<style>
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:'Courier New',monospace;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  body.portrait #wrap{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 52px)}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0b12;box-shadow:0 0 40px #00ff6633;outline:none;touch-action:none}
  #hint{position:fixed;bottom:4px;left:0;right:0;text-align:center;color:#3a6;font-size:11px;letter-spacing:1px;pointer-events:none;opacity:.7}

  /* ---------- touch controls ---------- */
  #tc, #tc *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
  .tb{display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:50%;
      font:bold 13px 'Courier New',monospace;letter-spacing:1px;color:#e8fff2;text-shadow:0 0 6px #00ff66;
      background:radial-gradient(circle at 35% 30%,rgba(0,255,102,.22),rgba(6,10,20,.55) 70%);
      border:2px solid rgba(0,255,102,.55);box-shadow:0 0 14px rgba(0,255,102,.25),inset 0 0 12px rgba(0,255,102,.15);
      backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .05s,background .05s;cursor:pointer}
  .tb small{font-size:9px;opacity:.75;letter-spacing:0;margin-top:1px}
  .tb.on{transform:scale(.92);background:radial-gradient(circle at 35% 30%,rgba(0,255,102,.6),rgba(0,80,40,.6) 70%);box-shadow:0 0 22px rgba(0,255,102,.7)}
  #tc .grp{position:fixed;z-index:20;display:none}
  body.touch-on #tc .grp{display:block}
  body.touch-on.menu-mode #tc .play-only{display:none}
  /* d-pad */
  #pad{left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:168px;height:84px;border-radius:42px;
       background:rgba(6,10,20,.35);border:2px solid rgba(0,243,255,.35);box-shadow:0 0 16px rgba(0,243,255,.18)}
  #pad .half{position:absolute;top:6px;width:74px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:center;
       font-size:30px;color:#bff;text-shadow:0 0 8px #00f3ff;background:rgba(0,243,255,.08);border:1px solid rgba(0,243,255,.3)}
  #pad .half.l{left:6px} #pad .half.r{right:6px}
  #pad .half.on{background:rgba(0,243,255,.45);box-shadow:0 0 18px rgba(0,243,255,.7);color:#fff}
  /* action cluster */
  #acts{right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);width:200px;height:160px}
  #acts{pointer-events:none} #acts .tb{position:absolute;pointer-events:auto}
  #bJump{width:84px;height:84px;right:0;bottom:0;font-size:15px;color:#fff6c0;text-shadow:0 0 8px #ffd84a;
         border-color:rgba(255,216,74,.85);background:radial-gradient(circle at 35% 30%,rgba(255,216,74,.5),rgba(60,40,0,.55) 70%);box-shadow:0 0 18px rgba(255,216,74,.4)}
  #bJump.on{background:radial-gradient(circle at 35% 30%,rgba(255,240,150,.9),rgba(184,134,11,.7) 70%)}
  #bAct{width:66px;height:66px;right:92px;bottom:2px}
  #bSwap{width:58px;height:58px;right:12px;bottom:94px;border-color:rgba(255,63,164,.7);text-shadow:0 0 6px #ff3fa4;
         background:radial-gradient(circle at 35% 30%,rgba(255,63,164,.3),rgba(20,6,16,.55) 70%)}
  #bThrow{width:50px;height:50px;right:84px;bottom:76px;font-size:11px}
  #bUse{width:50px;height:50px;right:146px;bottom:78px;font-size:11px;border-color:rgba(0,243,255,.6);text-shadow:0 0 6px #00f3ff}
  /* top bar */
  #bar{top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 8px);display:flex!important;gap:6px;z-index:21}
  #bar .sb{min-width:40px;height:34px;padding:0 8px;border-radius:9px;display:flex;align-items:center;justify-content:center;
           font:bold 12px 'Courier New',monospace;color:#cfe;background:rgba(6,10,20,.6);border:1px solid rgba(0,255,102,.45);text-shadow:0 0 5px #00ff66;cursor:pointer}
  #bar .sb.on{background:rgba(0,255,102,.4)}
  #bar .sb.tonly{display:none}
  body.touch-on #bar .sb.tonly{display:flex}
  body.touch-on.menu-mode #bar .sb.play-only{display:none}
  #rot{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);z-index:19;display:none;
       font:bold 11px 'Courier New',monospace;color:#ffd84a;background:rgba(6,6,14,.8);border:1px solid #ffd84a66;border-radius:8px;padding:6px 10px;white-space:nowrap}
  body.touch-on.portrait.show-rot #rot{display:block}
  /* portrait: bigger thumbs, there is room under the screen */
  body.portrait #pad{transform:scale(1.1);transform-origin:left bottom;bottom:calc(env(safe-area-inset-bottom) + 30px);left:calc(env(safe-area-inset-left) + 10px)}
  body.portrait #acts{bottom:calc(env(safe-area-inset-bottom) + 26px);right:calc(env(safe-area-inset-right) + 10px)}
  body.portrait #bUse{right:112px;bottom:140px}
  @media (min-width:430px){ body.portrait #acts{transform:scale(1.12);transform-origin:right bottom} }
  body.portrait #rot{top:auto;bottom:calc(env(safe-area-inset-bottom) + 250px)}
  /* short landscape phones: stack the top bar down the right margin so it never covers the HUD */
  @media (max-height:520px) and (orientation:landscape){
    #bar{flex-direction:column;gap:4px;top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 6px)}
    #bar .sb{min-width:58px;height:29px;font-size:11px;padding:0 4px}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div>
<div id="tc" aria-hidden="true">
  <div id="pad" class="grp play-only"><div class="half l">◀</div><div class="half r">▶</div></div>
  <div id="acts" class="grp play-only">
    <div class="tb" id="bUse" data-code="KeyF">USE<small>F</small></div>
    <div class="tb" id="bThrow" data-code="KeyX">THROW<small>X</small></div>
    <div class="tb" id="bSwap" data-code="KeyQ">SWAP<small>⇄</small></div>
    <div class="tb" id="bAct" data-code="KeyE"><span id="actLbl">STACK</span><small>E</small></div>
    <div class="tb" id="bJump" data-code="Space">JUMP</div>
  </div>
  <div id="bar" class="grp">
    <div class="sb tonly play-only" data-code="KeyB" title="Borrow (B)">$ B</div>
    <div class="sb tonly play-only" data-code="KeyG" title="Beg (G)">🙏 G</div>
    <div class="sb tonly" data-code="Enter" title="OK / Continue (Enter)">↵ OK</div>
    <div class="sb" data-code="KeyM" title="Music (M)">♪ M</div>
    <div class="sb tonly" data-code="Escape" title="Pause / Back (Esc)">❚❚</div>
    <div class="sb" id="tcToggle" title="Show / hide touch controls">🎮</div>
  </div>
</div>
<div id="rot">⟳ Rotate for best view · portrait works too <span id="rotX">✕</span></div>
<audio id="bgm" loop preload="auto" playsinline>
  <source src="assets/money-trap-theme.m4a" type="audio/mp4">
  <source src="assets/money-trap-theme.mp3" type="audio/mpeg">
</audio>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
